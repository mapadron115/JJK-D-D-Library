name: Install validated static library

on:
  push:
    branches: [static-dossier-final]
    paths:
      - BOOTSTRAP_READY
      - .github/workflows/bootstrap-static-final.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: static-dossier-final
          fetch-depth: 0

      - name: Reconstruct exact archive
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(bootstrap-static-xz/part-*.txt)
          test "${#parts[@]}" -eq 46
          cat $(printf 'bootstrap-static-xz/part-%03d.txt ' $(seq 0 45)) | base64 -d > /tmp/jjk-static.tar.xz
          echo '4811b7bf3ad1cd31148c8f34ecd2f4b615adf9fc75fe3ba4fcf0c81f9c354894  /tmp/jjk-static.tar.xz' | sha256sum -c -
          mkdir -p /tmp/jjk-site
          tar -xJf /tmp/jjk-static.tar.xz -C /tmp/jjk-site

      - name: Repair legacy source links
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          fixes = {
              '/tmp/jjk-site/library/canon-repair-ledger.html': {
                  'href="jjk5e_comprehensive_player_guide_canon.html"': 'href="player-guide.html"',
                  'href="jjk5e_advanced_sorcery_systems_guide_canon.html"': 'href="advanced-sorcery.html"',
                  'href="jjk5e_ritual_codex_reviewed_player_edition_canon.html"': 'href="../index.html#library"',
                  'href="ten_shadows_technique_guide_canon.html"': 'href="../dossiers/e035.html"',
                  'href="bestiary_codex_set_two_mythology_jjk5e_canon.html"': 'href="bestiary-set-two.html"',
              },
              '/tmp/jjk-site/library/player-guide.html': {
                  'href="jjk5e_advanced_sorcery_systems_guide_canon.html"': 'href="advanced-sorcery.html"',
                  'href="../ten_shadows_guides/ten_shadows_technique_guide.html"': 'href="../dossiers/e035.html#technique-progression"',
                  'href="../ten_shadows_guides/ten_shadows_shikigami_guide.html"': 'href="../dossiers/e035.html#ten-shadows-shikigami-stat-blocks"',
                  'href="../ten_shadows_guides/wells_unknown_abyss_fusion_guide.html"': 'href="../dossiers/e035.html#ten-shadows-well-s-unknown-abyss"',
                  'href="../ten_shadows_guides/ten_shadows_shadow_wearing_guide.html"': 'href="../dossiers/e035.html#ten-shadows-shadow-wearing"',
              },
              '/tmp/jjk-site/dossiers/e035.html': {
                  'href="ten_shadows_shadow_wearing_guide.html"': 'href="#ten-shadows-shadow-wearing"',
              },
          }
          for filename, replacements in fixes.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  assert old in text, (filename, old)
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate all dossiers and routes
        shell: bash
        run: |
          set -euo pipefail
          test "$(find /tmp/jjk-site -type f | wc -l | tr -d ' ')" = 269
          test "$(find /tmp/jjk-site/dossiers -maxdepth 1 -type f -name 'e*.html' | wc -l | tr -d ' ')" = 244
          test -s /tmp/jjk-site/assets/styles.css
          test -s /tmp/jjk-site/assets/dossier-static.css
          node --check /tmp/jjk-site/assets/app.js
          node --check /tmp/jjk-site/data/library.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlsplit, unquote
          from html.parser import HTMLParser

          root = Path('/tmp/jjk-site').resolve()
          js = (root / 'data/library.js').read_text(encoding='utf-8')
          prefix = 'window.LIBRARY_ENTRIES='
          marker = ';\nwindow.LIBRARY_COLLECTIONS='
          entries = json.loads(js[len(prefix):js.index(marker)])
          assert len(entries) == 244
          assert [e['id'] for e in entries] == [f'e{i:03d}' for i in range(1, 245)]
          assert len({e['href'] for e in entries}) == 244
          assert not any('witch hat' in (e['title'] + ' ' + e['collection'] + ' ' + e.get('aliases', '')).casefold() for e in entries)

          class Scan(HTMLParser):
              def __init__(self):
                  super().__init__(); self.links=[]; self.ids=set(); self.h1=[]; self.in_h1=False
              def handle_starttag(self, tag, attrs):
                  data=dict(attrs)
                  if data.get('id'): self.ids.add(data['id'])
                  if data.get('name'): self.ids.add(data['name'])
                  if tag == 'h1': self.in_h1=True
                  for key in ('href','src'):
                      if data.get(key): self.links.append(data[key])
              def handle_endtag(self, tag):
                  if tag == 'h1': self.in_h1=False
              def handle_data(self, data):
                  if self.in_h1: self.h1.append(data)

          files={p.relative_to(root).as_posix():p for p in root.rglob('*') if p.is_file()}
          scans={}
          for rel,path in files.items():
              if path.suffix.lower() == '.html':
                  scan=Scan(); scan.feed(path.read_text(encoding='utf-8')); scans[rel]=scan

          for entry in entries:
              path=root / entry['href']
              assert path.is_file(), entry['href']
              assert path.stat().st_size >= 3000, entry['href']
              assert entry['title'].casefold() in ' '.join(scans[entry['href']].h1).casefold(), entry['id']

          for rel,scan in scans.items():
              source=files[rel]
              for value in scan.links:
                  if not value or value.startswith(('http://','https://','mailto:','tel:','javascript:','data:')): continue
                  parsed=urlsplit(value)
                  if parsed.scheme or parsed.netloc: continue
                  target=source if not parsed.path else (source.parent / unquote(parsed.path)).resolve()
                  assert target.exists(), (rel,value)
                  if parsed.fragment and target.suffix.lower() == '.html':
                      target_rel=target.relative_to(root).as_posix()
                      assert unquote(parsed.fragment) in scans[target_rel].ids, (rel,value)
          PY
          grep -qi 'Legendary Resistance' /tmp/jjk-site/dossiers/e035.html
          grep -qi '400 + 5PB' /tmp/jjk-site/dossiers/e035.html
          grep -qi 'Shadow Wearing' /tmp/jjk-site/dossiers/e035.html
          grep -Eqi "Well.?s Unknown Abyss" /tmp/jjk-site/dossiers/e035.html
          grep -qi 'Chimerafication' /tmp/jjk-site/dossiers/e035.html
          grep -qi 'Infinite Retail' /tmp/jjk-site/dossiers/e162.html
          grep -qi 'Heatblast' /tmp/jjk-site/dossiers/e243.html
          grep -qi 'Four Arms' /tmp/jjk-site/dossiers/e243.html
          grep -qi 'Way Big' /tmp/jjk-site/dossiers/e243.html
          grep -qi 'Fehu' /tmp/jjk-site/dossiers/e244.html
          grep -qi 'Bindrunes' /tmp/jjk-site/dossiers/e244.html
          ! grep -Rqi 'Witch Hat' /tmp/jjk-site/dossiers

      - name: Replace staging branch with clean site
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/jjk-site/. .
          git config user.name 'JJK Library Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Install repaired 244-dossier static library'
          git push origin HEAD:static-dossier-final
