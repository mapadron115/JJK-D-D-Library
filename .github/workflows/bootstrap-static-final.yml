name: Bootstrap validated static library

on:
  push:
    branches: [ static-dossier-final ]
    paths:
      - 'BOOTSTRAP_READY'
      - '.github/workflows/bootstrap-static-final.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: static-dossier-final
          fetch-depth: 0
      - name: Check archive pieces
        id: parts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(bootstrap-static-xz/part-*.txt)
          echo "count=${#parts[@]}" >> "$GITHUB_OUTPUT"
          if [ "${#parts[@]}" -eq 47 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Reconstruct and verify validated build
        if: steps.parts.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat $(printf 'bootstrap-static-xz/part-%03d.txt ' $(seq 0 46)) | base64 -d > /tmp/jjk_static_final.tar.xz
          echo '33a54bd6c6503eb5930f658a4abc63de7a9f01e00a5c8c270586a2ccfea8c2eb  /tmp/jjk_static_final.tar.xz' | sha256sum -c -
          rm -rf /tmp/site
          mkdir -p /tmp/site
          tar -xJf /tmp/jjk_static_final.tar.xz -C /tmp/site
          test "$(find /tmp/site -type f | wc -l)" -eq 268
          test -f /tmp/site/dossiers/e035.html
          test -f /tmp/site/dossiers/e162.html
          test -f /tmp/site/dossiers/e243.html
          test -f /tmp/site/dossiers/e244.html
          grep -q 'Legendary Resistance' /tmp/site/dossiers/e035.html
          grep -q 'Infinite Retail' /tmp/site/dossiers/e162.html
          grep -q 'Way Big' /tmp/site/dossiers/e243.html
          grep -q 'Bindrunes' /tmp/site/dossiers/e244.html
          ! grep -Rqi 'Witch Hat' /tmp/site/dossiers || exit 1
      - name: Replace staging tree with validated build
        if: steps.parts.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/site/. .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy validated 244-dossier static library'
          git push origin HEAD:static-dossier-final
