name: Install validated static dossier build

on:
  push:
    branches: [static-dossier-final]
    paths: ['.github/workflows/install-static-build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: static-dossier-final
          fetch-depth: 0

      - name: Download validated archive
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1ZADKAKKLDBfJbE96XXgJm-tH5ebTTZu1&export=download&confirm=t' \
            -o /tmp/jjk_static_final.zip
          unzip -t /tmp/jjk_static_final.zip >/dev/null
          rm -rf /tmp/jjk-site
          mkdir -p /tmp/jjk-site
          unzip -q /tmp/jjk_static_final.zip -d /tmp/jjk-site

      - name: Validate archive before install
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/jjk-site/index.html
          test -f /tmp/jjk-site/dossier.html
          test -f /tmp/jjk-site/dossiers/e035.html
          test -f /tmp/jjk-site/dossiers/e162.html
          test -f /tmp/jjk-site/dossiers/e243.html
          test -f /tmp/jjk-site/dossiers/e244.html
          test "$(find /tmp/jjk-site/dossiers -maxdepth 1 -name 'e*.html' | wc -l)" -eq 244
          grep -qi 'Mahoraga' /tmp/jjk-site/dossiers/e035.html
          grep -qi 'Legendary Resistance' /tmp/jjk-site/dossiers/e035.html
          grep -qi 'Shadow Wearing' /tmp/jjk-site/dossiers/e035.html
          grep -qi "Well.s Unknown Abyss" /tmp/jjk-site/dossiers/e035.html
          grep -qi 'Chimerafication' /tmp/jjk-site/dossiers/e035.html
          grep -qi 'Heatblast' /tmp/jjk-site/dossiers/e243.html
          grep -qi 'Four Arms' /tmp/jjk-site/dossiers/e243.html
          grep -qi 'Way Big' /tmp/jjk-site/dossiers/e243.html
          grep -qi 'Fehu' /tmp/jjk-site/dossiers/e244.html
          grep -qi 'Bindrunes' /tmp/jjk-site/dossiers/e244.html
          grep -qi 'Infinite Retail' /tmp/jjk-site/dossiers/e162.html
          ! grep -Rqi 'Witch Hat' /tmp/jjk-site/dossiers

      - name: Install static site
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            /tmp/jjk-site/ ./

      - name: Commit staged site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'JJK Library Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Static build already installed.'
          else
            git commit -m 'Install validated 244-dossier static library'
            git push origin HEAD:static-dossier-final
          fi
