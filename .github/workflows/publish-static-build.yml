name: Publish validated static dossier library

on:
  push:
    branches: [static-dossier-final]
    paths: ['.github/workflows/publish-static-build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: static-dossier-final
          fetch-depth: 0

      - name: Download validated archive
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet gdown
          gdown '1ZADKAKKLDBfJbE96XXgJm-tH5ebTTZu1' -O /tmp/jjk_static_final.zip
          unzip -t /tmp/jjk_static_final.zip >/dev/null
          rm -rf /tmp/jjk-site
          mkdir -p /tmp/jjk-site
          unzip -q /tmp/jjk_static_final.zip -d /tmp/jjk-site

      - name: Validate complete archive
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/jjk-site/index.html
          test -f /tmp/jjk-site/dossier.html
          test -f /tmp/jjk-site/library/player-guide.html
          test -f /tmp/jjk-site/library/advanced-sorcery.html
          for id in e035 e162 e243 e244; do test -s "/tmp/jjk-site/dossiers/${id}.html"; done
          dossier_count="$(find /tmp/jjk-site/dossiers -maxdepth 1 -type f -name 'e*.html' | wc -l | tr -d ' ')"
          test "$dossier_count" = '244'
          grep -qi 'Mahoraga' /tmp/jjk-site/dossiers/e035.html
          grep -qi 'Legendary Resistance' /tmp/jjk-site/dossiers/e035.html
          grep -qi 'Shadow Wearing' /tmp/jjk-site/dossiers/e035.html
          grep -Eqi "Well.?s Unknown Abyss" /tmp/jjk-site/dossiers/e035.html
          grep -qi 'Chimerafication' /tmp/jjk-site/dossiers/e035.html
          grep -qi 'Heatblast' /tmp/jjk-site/dossiers/e243.html
          grep -qi 'Four Arms' /tmp/jjk-site/dossiers/e243.html
          grep -qi 'Way Big' /tmp/jjk-site/dossiers/e243.html
          grep -qi 'Fehu' /tmp/jjk-site/dossiers/e244.html
          grep -qi 'Bindrunes' /tmp/jjk-site/dossiers/e244.html
          grep -qi 'Infinite Retail' /tmp/jjk-site/dossiers/e162.html
          ! grep -Rqi 'Witch Hat' /tmp/jjk-site/dossiers
          grep -Eq 'dossiers/e[0-9]{3}\.html' /tmp/jjk-site/index.html
          echo "Validated ${dossier_count} dossier pages."

      - name: Install clean site on staging checkout
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='.github/' /tmp/jjk-site/ ./

      - name: Revalidate installed tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dossiers -maxdepth 1 -type f -name 'e*.html' | wc -l | tr -d ' ')" = '244'
          grep -qi 'Mahoraga' dossiers/e035.html
          grep -qi 'Way Big' dossiers/e243.html
          grep -qi 'Bindrunes' dossiers/e244.html
          grep -qi 'Infinite Retail' dossiers/e162.html
          ! grep -Rqi 'Witch Hat' dossiers

      - name: Commit staging build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'JJK Library Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then git commit -m 'Install validated 244-dossier static library'; fi
          git push origin HEAD:static-dossier-final

      - name: Guard main fast-forward
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD

      - name: Publish validated commit to main
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:main

      - name: Verify main repository content
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          base='https://raw.githubusercontent.com/mapadron115/JJK-D-D-Library/main'
          curl -fsSL "$base/dossiers/e035.html" | grep -qi 'Mahoraga'
          curl -fsSL "$base/dossiers/e243.html" | grep -qi 'Way Big'
          curl -fsSL "$base/dossiers/e244.html" | grep -qi 'Bindrunes'
          curl -fsSL "$base/dossiers/e162.html" | grep -qi 'Infinite Retail'

# Drive-aware trigger syntax fix 2026-09-04.
